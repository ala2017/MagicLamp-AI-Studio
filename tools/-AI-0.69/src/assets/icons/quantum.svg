<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 外圈电子轨道 -->
  <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 2"/>
  
  <!-- 内圈电子轨道 -->
  <circle cx="12" cy="12" r="6" stroke="currentColor" stroke-width="1.5" stroke-dasharray="3 1.5"/>
  
  <!-- 核心 -->
  <circle cx="12" cy="12" r="2" fill="currentColor"/>
  
  <!-- 电子 -->
  <circle cx="20" cy="12" r="1.5" fill="currentColor">
    <animateMotion 
      dur="3s" 
      repeatCount="indefinite"
      path="M 0 0 A 8 8 0 1 1 0 0.01"
    />
  </circle>
  
  <!-- 量子波 -->
  <path d="M 4 12 Q 12 6, 20 12 Q 12 18, 4 12" 
    stroke="currentColor" 
    stroke-width="1.5" 
    fill="none" 
    opacity="0.5"
  >
    <animate 
      attributeName="d" 
      dur="2s"
      repeatCount="indefinite"
      values="
        M 4 12 Q 12 6, 20 12 Q 12 18, 4 12;
        M 4 12 Q 12 18, 20 12 Q 12 6, 4 12;
        M 4 12 Q 12 6, 20 12 Q 12 18, 4 12
      "
    />
  </path>
</svg> 