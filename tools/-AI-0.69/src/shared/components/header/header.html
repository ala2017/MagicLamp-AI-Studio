<header class="header">
    <div class="brand">
        <h1>神灯AI书签</h1>
        <span class="version">v0.72</span>
    </div>
    
    <div class="stats">
        <div class="stat-item">
            <img src="../../assets/icons/bookmark.svg" alt="总数" class="icon">
            <span class="stat-count" id="totalCount">0</span>
            <span class="stat-label">总数</span>
        </div>
        <div class="stat-item">
            <img src="../../assets/icons/star.svg" alt="收藏" class="icon">
            <span class="stat-count" id="favoriteCount">0</span>
            <span class="stat-label">收藏</span>
        </div>
        <div class="stat-item">
            <img src="../../assets/icons/clock.svg" alt="今日" class="icon">
            <span class="stat-count" id="todayCount">0</span>
            <span class="stat-label">今日</span>
        </div>
    </div>
    
    <div class="actions">
        <button class="btn btn-primary" id="syncBtn">
            <img src="../../assets/icons/sync.svg" alt="同步" class="icon">
            同步书签
        </button>
        <button class="btn btn-success" id="addBtn">
            <img src="../../assets/icons/plus.svg" alt="添加" class="icon">
            添加书签
        </button>
        <button class="btn btn-warning" id="checkBtn">
            <img src="../../assets/icons/check.svg" alt="检查" class="icon">
            链接检查
        </button>
        <button class="btn btn-info" id="aiBtn">
            <img src="../../assets/icons/ai.svg" alt="AI" class="icon">
            AI助手
        </button>
        <button class="btn btn-random" id="randomBtn">
            <img src="../../assets/icons/dice.svg" alt="随机" class="icon">
        </button>
        
        <div class="utils">
            <button class="btn-icon" id="settingsBtn">
                <img src="../../assets/icons/settings.svg" alt="设置" class="icon">
            </button>
            <button class="btn-icon" id="themeBtn">
                <img src="../../assets/icons/theme.svg" alt="主题" class="icon">
            </button>
        </div>
    </div>
</header>
