<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>AI设置图标预览</title>
    <style>
        body {
            background: #1e293b;
            color: white;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
        }
        .preview-container {
            display: flex;
            gap: 2rem;
            margin-top: 2rem;
        }
        .icon-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 1rem;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }
        .icon-wrapper {
            width: 120px;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 0.5rem;
            padding: 1rem;
        }
        svg {
            width: 100%;
            height: 100%;
            color: #f43f5e;
        }
        h2 {
            margin: 0;
            font-size: 1rem;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <h1>AI设置图标方案预览</h1>
    <div class="preview-container">
        <div class="icon-card">
            <div class="icon-wrapper">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <!-- 外部齿轮 -->
                    <path d="M12 15C13.6569 15 15 13.6569 15 12C15 10.3431 13.6569 9 12 9C10.3431 9 9 10.3431 9 12C9 13.6569 10.3431 15 12 15Z" stroke="currentColor" stroke-width="1.5"/>
                    <path d="M19.1 15.3L17.7 14.7C17.9 14 18 13.3 18 12.5C18 11.7 17.9 11 17.7 10.3L19.1 9.7C19.4 10.6 19.5 11.5 19.5 12.5C19.5 13.5 19.3 14.4 19.1 15.3ZM15.3 19.1L14.7 17.7C14 17.9 13.3 18 12.5 18C11.7 18 11 17.9 10.3 17.7L9.7 19.1C10.6 19.4 11.5 19.5 12.5 19.5C13.5 19.5 14.4 19.3 15.3 19.1ZM9.7 5.9L10.3 7.3C11 7.1 11.7 7 12.5 7C13.3 7 14 7.1 14.7 7.3L15.3 5.9C14.4 5.6 13.5 5.5 12.5 5.5C11.5 5.5 10.6 5.7 9.7 5.9Z" stroke="currentColor" stroke-width="1.5"/>
                    <!-- 内部神经网络 -->
                    <circle cx="12" cy="12" r="1.5" fill="currentColor"/>
                    <circle cx="10" cy="10" r="1" fill="currentColor"/>
                    <circle cx="14" cy="10" r="1" fill="currentColor"/>
                    <circle cx="10" cy="14" r="1" fill="currentColor"/>
                    <circle cx="14" cy="14" r="1" fill="currentColor"/>
                    <path d="M10 10L12 12M14 10L12 12M10 14L12 12M14 14L12 12" stroke="currentColor" stroke-width="0.75"/>
                </svg>
            </div>
            <h2>方案一：简约风格</h2>
        </div>

        <div class="icon-card">
            <div class="icon-wrapper">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <!-- 外部齿轮 -->
                    <path d="M12 8V4M12 20v-4M4 12H8M16 12h4M6.34 6.34l2.83 2.83M14.83 14.83l2.83 2.83M6.34 17.66l2.83-2.83M14.83 9.17l2.83-2.83" stroke="currentColor" stroke-width="1.5"/>
                    <path d="M12 15a3 3 0 100-6 3 3 0 000 6z" stroke="currentColor" stroke-width="1.5"/>
                    <!-- 内部神经网络 -->
                    <circle cx="12" cy="12" r="1" fill="currentColor"/>
                    <circle cx="10.5" cy="10.5" r="0.5" fill="currentColor"/>
                    <circle cx="13.5" cy="10.5" r="0.5" fill="currentColor"/>
                    <circle cx="10.5" cy="13.5" r="0.5" fill="currentColor"/>
                    <circle cx="13.5" cy="13.5" r="0.5" fill="currentColor"/>
                    <path d="M10.5 10.5L12 12M13.5 10.5L12 12M10.5 13.5L12 12M13.5 13.5L12 12" stroke="currentColor" stroke-width="0.5"/>
                </svg>
            </div>
            <h2>方案二：科技风格</h2>
        </div>

        <div class="icon-card">
            <div class="icon-wrapper">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <!-- 外部齿轮 -->
                    <path d="M14.7 6.3C13.9 6.1 13 6 12 6C7.6 6 4 9.6 4 14C4 18.4 7.6 22 12 22C16.4 22 20 18.4 20 14C20 13 19.9 12.1 19.7 11.3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    <path d="M12 14C13.1046 14 14 13.1046 14 12C14 10.8954 13.1046 10 12 10C10.8954 10 10 10.8954 10 12C10 13.1046 10.8954 14 12 14Z" stroke="currentColor" stroke-width="1.5"/>
                    <!-- 内部神经网络 -->
                    <circle cx="12" cy="12" r="0.75" fill="currentColor"/>
                    <circle cx="10.5" cy="10.5" r="0.5" fill="currentColor"/>
                    <circle cx="13.5" cy="10.5" r="0.5" fill="currentColor"/>
                    <circle cx="10.5" cy="13.5" r="0.5" fill="currentColor"/>
                    <circle cx="13.5" cy="13.5" r="0.5" fill="currentColor"/>
                    <path d="M10.5 10.5L12 12M13.5 10.5L12 12M10.5 13.5L12 12M13.5 13.5L12 12" stroke="currentColor" stroke-width="0.5"/>
                    <!-- 点缀装饰 -->
                    <path d="M17 3L19 5M19 3L17 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                </svg>
            </div>
            <h2>方案三：现代简洁风格</h2>
        </div>
    </div>

    <div class="icon-card">
        <div class="icon-wrapper">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- 字母 A -->
                <path d="M6 20L10 4H12L16 20M7.5 14H14.5" 
                      stroke="currentColor" 
                      stroke-width="2" 
                      stroke-linecap="round" 
                      stroke-linejoin="round"/>
                
                <!-- 简约扳手 -->
                <path d="M20 12C20 10.62 18.88 9.5 17.5 9.5C16.12 9.5 15 10.62 15 12C15 13.38 16.12 14.5 17.5 14.5C18.88 14.5 20 13.38 20 12Z"
                      stroke="currentColor"
                      stroke-width="1.5"/>
                <path d="M17.5 14.5V20"
                      stroke="currentColor"
                      stroke-width="1.5"
                      stroke-linecap="round"/>
            </svg>
        </div>
        <h2>A + 扳手组合</h2>
    </div>
</body>
</html>
