<div class="model-settings">
    <!-- 标签页 -->
    <div class="model-tabs">
        <button class="model-tab active" data-provider="siliconio">
            <img src="/src/assets/providers/siliconio-logo.png" alt="" class="provider-icon">
            硅基流动
            <span class="selected-badge">已选</span>
        </button>
        <button class="model-tab" data-provider="deepseek">
            <img src="/src/assets/providers/deepseek-logo.png" alt="" class="provider-icon">
            DeepSeek
            <span class="selected-badge">已选</span>
        </button>
        <button class="model-tab" data-provider="openai">
            <img src="/src/assets/providers/openai-logo.png" alt="" class="provider-icon">
            OpenAI
            <span class="selected-badge">已选</span>
        </button>
        <button class="model-tab" data-provider="gemini">
            <img src="/src/assets/providers/gemini-logo.png" alt="" class="provider-icon">
            Gemini
            <span class="selected-badge">已选</span>
        </button>
    </div>
    
    <!-- 内容区域 -->
    <div class="model-contents">
        <!-- 硅基流动 -->
        <div id="siliconio-content" class="model-tab-content active">
            <div class="provider-form">
                <div class="form-group">
                    <label for="siliconio-api-key">API Key</label>
                    <div class="input-with-action">
                        <input type="password" id="siliconio-api-key" class="api-key-input" placeholder="输入您的硅基流动API Key">
                        <button class="toggle-password"><i class="eye-icon"></i></button>
                    </div>
                </div>
                <div class="form-group">
                    <label for="siliconio-model">选择模型</label>
                    <select id="siliconio-model" class="model-select">
                        <option value="deepseek-ai/DeepSeek-V3">DeepSeek V3</option>
                        <option value="deepseek-ai/DeepSeek-R1">DeepSeek R1</option>
                        <option value="Qwen/Qwen2.5-7B-Instruct">Qwen 2.5 7B</option>
                        <option value="meta-llama/Meta-Llama-3.1-8B-Instruct">Llama 3.1 8B</option>
                        <option value="Qwen/QwQ-32B-Preview">QwQ 32B</option>
                    </select>
                </div>
                <div class="form-actions">
                    <button class="test-model-btn" data-provider="siliconio">测试连接</button>
                    <button class="save-model-btn primary" data-provider="siliconio">保存设置</button>
                </div>
            </div>
        </div>
        
        <!-- DeepSeek -->
        <div id="deepseek-content" class="model-tab-content">
            <div class="provider-form">
                <div class="form-group">
                    <label for="deepseek-api-key">API Key</label>
                    <div class="input-with-action">
                        <input type="password" id="deepseek-api-key" class="api-key-input" placeholder="输入您的DeepSeek API Key">
                        <button class="toggle-password"><i class="eye-icon"></i></button>
                    </div>
                </div>
                <div class="form-group">
                    <label for="deepseek-model">选择模型</label>
                    <select id="deepseek-model" class="model-select">
                        <option value="deepseek-chat">DeepSeek V3</option>
                        <option value="deepseek-reasoner">DeepSeek R1</option>
                        <option value="deepseek-coder">DeepSeek Coder</option>
                        <option value="deepseek-math">DeepSeek Math</option>
                    </select>
                </div>
                <div class="form-actions">
                    <button class="test-model-btn" data-provider="deepseek">测试连接</button>
                    <button class="save-model-btn primary" data-provider="deepseek">保存设置</button>
                </div>
            </div>
        </div>
        
        <!-- OpenAI -->
        <div id="openai-content" class="model-tab-content">
            <div class="provider-form">
                <div class="form-group">
                    <label for="openai-api-key">API Key</label>
                    <div class="input-with-action">
                        <input type="password" id="openai-api-key" class="api-key-input" placeholder="输入您的OpenAI API Key">
                        <button class="toggle-password"><i class="eye-icon"></i></button>
                    </div>
                </div>
                <div class="form-group">
                    <label for="openai-model">选择模型</label>
                    <select id="openai-model" class="model-select">
                        <option value="gpt-4">GPT-4</option>
                        <option value="gpt-4-turbo">GPT-4 Turbo</option>
                        <option value="gpt-3.5-turbo">GPT-3.5 Turbo</option>
                    </select>
                </div>
                <div class="form-actions">
                    <button class="test-model-btn" data-provider="openai">测试连接</button>
                    <button class="save-model-btn primary" data-provider="openai">保存设置</button>
                </div>
            </div>
        </div>
        
        <!-- Gemini -->
        <div id="gemini-content" class="model-tab-content">
            <div class="provider-form">
                <div class="form-group">
                    <label for="gemini-api-key">API Key</label>
                    <div class="input-with-action">
                        <input type="password" id="gemini-api-key" class="api-key-input" placeholder="输入您的Gemini API Key">
                        <button class="toggle-password"><i class="eye-icon"></i></button>
                    </div>
                </div>
                <div class="form-group">
                    <label for="gemini-model">选择模型</label>
                    <select id="gemini-model" class="model-select">
                        <option value="gemini-pro">Gemini Pro</option>
                        <option value="gemini-pro-vision">Gemini Pro Vision</option>
                        <option value="gemini-ultra">Gemini Ultra</option>
                    </select>
                </div>
                <div class="form-actions">
                    <button class="test-model-btn" data-provider="gemini">测试连接</button>
                    <button class="save-model-btn primary" data-provider="gemini">保存设置</button>
                </div>
            </div>
        </div>
    </div>
</div>
