<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>神灯AI书签管理器</title>
    <!-- 备选字体样式已移至 fonts.css -->
    <link rel="stylesheet" href="/src/shared/styles/themes.css">
    <link rel="stylesheet" href="/src/shared/styles/common.css">
    <link rel="stylesheet" href="/src/pages/home/home.css">
    <!-- 添加缓存管理器 -->
    <script src="/src/shared/utils/cache-manager.js"></script>
    <style>
        /* 添加关键的根元素样式 */
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        /* 确保主容器占满视口 */
        .main {
            width: 100%;
            height: 100%;
            display: flex;
            overflow: hidden;
        }
        
        /* 调试信息样式 */
        #debug-info {
            position: fixed;
            bottom: 10px;
            right: 10px;
            background-color: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 10px;
            border-radius: 5px;
            font-size: 12px;
            max-width: 300px;
            max-height: 200px;
            overflow: auto;
            z-index: 9999;
            display: none;
        }
    </style>
</head>
<body>
    <!-- 顶部导航栏 -->
    <header class="header">
        <div class="brand">
            <h1>神灯AI书签管理器</h1>
            <span class="version">v0.72</span>
        </div>

        <div class="stats">
            <div class="stat-item">
                <img src="/src/assets/icons/bookmark.svg" alt="书签" class="icon">
                <span class="stat-count" id="totalBookmarks">0</span>
                <span class="stat-label">书签总数</span>
            </div>
            <div class="stat-item">
                <img src="/src/assets/icons/folder.svg" alt="文件夹" class="icon">
                <span class="stat-count" id="totalFolders">0</span>
                <span class="stat-label">目录总数</span>
            </div>
            <div class="stat-item" id="cacheStatus" style="display: none;">
                <img src="/src/assets/icons/cache.svg" alt="缓存" class="icon">
                <span class="stat-label">使用缓存数据</span>
                <button class="btn-icon refresh-cache" id="refreshCache" title="刷新数据">
                    <img src="/src/assets/icons/refresh.svg" alt="刷新" class="icon">
                </button>
            </div>
        </div>

        <div class="actions">
            <button class="btn btn-random" id="randomBookmark">
                <img src="/src/assets/icons/dice_icon32.png" alt="" class="icon">
            </button>
            <button class="btn btn-primary" id="homeBtn">
                <img src="/src/assets/icons/home.svg" alt="" class="icon">
                首页
            </button>
            <button class="btn btn-success" id="checkBtn">
                <img src="/src/assets/icons/check.svg" alt="" class="icon">
                检查链接
            </button>
            <button class="btn btn-warning" id="duplicateBtn">
                <img src="/src/assets/icons/find.svg" alt="" class="icon">
                查找重复
            </button>
            <button class="btn btn-info" id="aiAssistant">
                <img src="/src/assets/icons/ai.svg" alt="" class="icon">
                AI辅助
            </button>
            
            <div class="utils">
                <button class="btn-icon" id="themeToggle">
                    <img src="/src/assets/icons/theme.svg" alt="主题" class="icon">
                </button>
                <button class="btn-icon" id="langToggle">中</button>
                <button class="btn-icon" id="settings">
                    <img src="/src/assets/icons/settings.svg" alt="设置" class="icon">
                </button>
            </div>
        </div>
    </header>

    <!-- 主内容区域 -->
    <main class="main">
        <!-- 常用书签区域 -->
        <section class="bookmark-section active">
            <h2 class="section-title">常用的书签</h2>
            <div class="bookmark-grid" id="frequentBookmarks">
                <!-- 书签卡片将通过JS动态插入 -->
            </div>
        </section>

        <!-- 被冷落的书签区域 -->
        <section class="bookmark-section inactive">
            <h2 class="section-title">被冷落的书签</h2>
            <div class="bookmark-grid" id="unvisitedBookmarks">
                <!-- 书签卡片将通过JS动态插入 -->
            </div>
        </section>
    </main>

    <!-- 调试信息面板 -->
    <div id="debug-info"></div>

    <!-- 导入脚本 -->
    <script src="/src/pages/home/home.js"></script>
    <script src="/src/shared/utils/debug-helper.js"></script>
    <script src="/src/pages/home/home-scripts.js"></script>
</body>
</html>
