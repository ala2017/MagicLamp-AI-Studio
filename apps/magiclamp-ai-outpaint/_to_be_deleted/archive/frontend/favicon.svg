<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
    <!-- 定义滤镜和渐变 -->
    <defs>
        <!-- 外发光滤镜 -->
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="24" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
        
        <!-- 背景渐变 -->
        <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#141418" />
            <stop offset="100%" stop-color="#0a0a0c" />
        </linearGradient>

        <!-- 神灯主色渐变 -->
        <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffe259" />
            <stop offset="100%" stop-color="#ffa751" />
        </linearGradient>
    </defs>

    <!-- 圆角背景底板 -->
    <rect width="512" height="512" rx="112" fill="url(#bgGradient)" />
    
    <!-- 底层极光光晕 -->
    <circle cx="256" cy="256" r="140" fill="#f0a830" opacity="0.15" filter="url(#glow)"/>

    <!-- 四角扩图边界指示 (Outpaint 概念) -->
    <g stroke="rgba(240, 168, 48, 0.5)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M120 160 L120 120 L160 120" />
        <path d="M392 160 L392 120 L352 120" />
        <path d="M120 352 L120 392 L160 392" />
        <path d="M392 352 L392 392 L352 392" />
    </g>

    <!-- 虚线扩展框 -->
    <rect x="120" y="120" width="272" height="272" fill="none" stroke="rgba(255, 255, 255, 0.1)" stroke-width="4" stroke-dasharray="16 16" rx="24" />

    <!-- 核心区域：神灯 (Magic Lamp) 抽象图形 -->
    <g transform="translate(126, 150)">
        <!-- 壶身 -->
        <path d="M170 170 C170 200, 120 210, 120 210 L140 210 C140 210, 220 210, 220 180 C220 150, 180 130, 150 130 C120 130, 90 140, 70 160 C50 180, 50 190, 50 190" fill="none" stroke="url(#goldGradient)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
        <!-- 壶嘴 -->
        <path d="M50 190 C40 190, 30 180, 30 170 C30 160, 40 150, 50 140" fill="none" stroke="url(#goldGradient)" stroke-width="16" stroke-linecap="round"/>
        <!-- 盖子 -->
        <path d="M120 130 C120 110, 140 100, 160 110" fill="none" stroke="url(#goldGradient)" stroke-width="16" stroke-linecap="round"/>
        <!-- 底座 -->
        <line x1="120" y1="230" x2="160" y2="230" stroke="url(#goldGradient)" stroke-width="16" stroke-linecap="round"/>
        <line x1="140" y1="210" x2="140" y2="230" stroke="url(#goldGradient)" stroke-width="16" stroke-linecap="round"/>
    </g>

    <!-- AI 魔法星光 (Stars) -->
    <g fill="url(#goldGradient)">
        <!-- 大星 -->
        <path d="M256 120 Q256 160 216 160 Q256 160 256 200 Q256 160 296 160 Q256 160 256 120 Z" />
        <!-- 小星1 -->
        <path d="M180 100 Q180 120 160 120 Q180 120 180 140 Q180 120 200 120 Q180 120 180 100 Z" opacity="0.8"/>
        <!-- 小星2 -->
        <path d="M330 150 Q330 165 315 165 Q330 165 330 180 Q330 165 345 165 Q330 165 330 150 Z" opacity="0.6"/>
    </g>
</svg>
