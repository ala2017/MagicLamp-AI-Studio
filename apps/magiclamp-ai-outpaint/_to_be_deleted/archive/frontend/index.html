<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>神灯AI · Outpaint — 智能扩图工作站</title>
    <meta name="description" content="私有化部署的 AI 智能扩图工具，将任意图片扩展为 16:9 高清壁纸">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/index.css?v=2">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
</head>
<body>
    <!-- ====== 顶部导航 ====== -->
    <header id="app-header">
        <div class="header-left">
            <img src="/static/favicon.svg" alt="Logo" class="logo-icon" style="width: 28px; height: 28px; margin-right: 8px;">
            <h1>神灯AI · <span class="accent">Outpaint</span></h1>
        </div>
        <div class="header-right">
            <!-- 时钟 -->
            <div id="gen-timer" class="badge badge-timer hidden">
                <i data-lucide="timer" style="width: 14px; height: 14px;"></i>
                <span id="gen-timer-text">00.00s</span>
            </div>
            
            <div id="gpu-badge" class="badge badge-loading">
                <span class="badge-dot"></span>
                <span id="gpu-name">检测中...</span>
                
                <!-- 显存监控色块 -->
                <div id="vram-monitor" class="vram-monitor hidden">
                    <div class="vram-blocks" id="vram-blocks">
                        <!-- JS 动态生成 8 个块 -->
                    </div>
                    <span id="vram-text">--GB / --GB</span>
                </div>
            </div>
        </div>
    </header>

    <!-- ====== 主工作区 ====== -->
    <main id="workspace">
        <!-- 真正的极光流体层 (Mesh Gradient Aurora) -->
        <div class="aurora-bg">
            <div class="aurora-blob blob-1"></div>
            <div class="aurora-blob blob-2"></div>
            <div class="aurora-blob blob-3"></div>
        </div>
        
        <!-- 画板容器 -->
        <div id="canvas-wrapper">
            <div id="canvas-container">
                <canvas id="fabric-canvas"></canvas>
                <!-- 空状态提示（可点击上传） -->
                <div id="empty-state" style="cursor: pointer;">
                    <i data-lucide="image-plus" class="empty-icon"></i>
                    <p class="empty-title">拖放图片到此处</p>
                    <p class="empty-sub">或点击此区域上传</p>
                    <p class="empty-hint">支持 JPG / PNG / WebP</p>
                </div>
                <!-- 生成中遮罩 -->
                <div id="generating-overlay" class="hidden">
                    <div class="gen-spinner"></div>
                    <p class="gen-text">AI 正在创作中...</p>
                    <div class="gen-progress-bar">
                        <div id="gen-progress-fill" class="gen-progress-fill"></div>
                    </div>
                    <p id="gen-progress-text" class="gen-progress-text">0%</p>
                    
                    <!-- 极客终端输出 -->
                    <div id="geek-terminal" class="geek-terminal">
                        <div class="terminal-lines" id="terminal-lines">
                            <!-- JS 动态插入 -->
                        </div>
                    </div>
                </div>
            </div>
            <div class="canvas-info">
                <span>1280 × 720 (出图后支持高清放大)</span>
                <span>16:9</span>
            </div>
        </div>
    </main>

    <!-- ====== 底部工具栏 ====== -->
    <footer id="toolbar">
        <div class="toolbar-group">
            <input type="file" id="file-input" accept="image/*" hidden>
            <button id="btn-upload" class="btn btn-secondary" title="上传图片">
                <i data-lucide="upload" class="btn-icon"></i>
                上传图片
            </button>
            <button id="btn-reset" class="btn btn-ghost" title="重置画板" disabled>
                <i data-lucide="rotate-ccw" class="btn-icon"></i>
                重置
            </button>
        </div>
        <div class="toolbar-group toolbar-center">
            <div class="prompt-inline">
                <input type="text" id="prompt-input" class="prompt-field" placeholder="提示词（可选）：留空自动延伸背景...">
            </div>
            <button id="btn-generate" class="btn btn-primary" title="开始生成" disabled>
                <i data-lucide="wand-2" class="btn-icon"></i>
                生成壁纸
            </button>
        </div>
        <div class="toolbar-group">
            <button id="btn-upscale-x2" class="btn btn-accent hidden" title="使用 RealESRGAN 放大至 2K">
                <i data-lucide="zoom-in" class="btn-icon"></i>
                放大 2x
            </button>
            <button id="btn-upscale-x4" class="btn btn-accent hidden" title="使用 RealESRGAN 放大至 4K">
                <i data-lucide="zoom-in" class="btn-icon"></i>
                放大 4x
            </button>
            <button id="btn-download" class="btn btn-secondary hidden" title="下载壁纸">
                <i data-lucide="download" class="btn-icon"></i>
                下载壁纸
            </button>
            <button id="btn-settings" class="btn btn-ghost" title="生成参数">
                <i data-lucide="settings" class="btn-icon"></i>
            </button>
        </div>
    </footer>

    <!-- ====== 参数设置浮层 ====== -->
    <div id="settings-panel" class="settings-panel hidden">
        <div class="settings-header">
            <span>⚙️ 生成参数</span>
            <button id="btn-settings-close" class="settings-close">&times;</button>
        </div>
        <div class="settings-body">
            <div class="setting-row">
                <label for="setting-guidance">引导强度</label>
                <div class="setting-control">
                    <input type="range" id="setting-guidance" min="1" max="50" step="0.5" value="30">
                    <span id="setting-guidance-val" class="setting-val">30</span>
                </div>
            </div>
            <div class="setting-row">
                <label for="setting-steps">推理步数</label>
                <div class="setting-control">
                    <input type="range" id="setting-steps" min="10" max="50" step="1" value="28">
                    <span id="setting-steps-val" class="setting-val">28</span>
                </div>
            </div>
            <div class="setting-row">
                <label for="setting-seed">随机种子</label>
                <div class="setting-control">
                    <input type="number" id="setting-seed" value="-1" min="-1" class="setting-number">
                    <span class="setting-hint">-1 = 随机</span>
                </div>
            </div>
        </div>
    </div>

    <!-- ====== 高清对比预览弹窗 ====== -->
    <div id="upscale-modal" class="modal-overlay hidden">
        <div class="modal-content upscale-modal-content">
            <div class="modal-header">
                <h3>✨ 超清放大对比预览 (RealESRGAN 4K)</h3>
                <button id="btn-upscale-close" class="settings-close" title="放弃放大并返回">&times;</button>
            </div>
            <div class="modal-body">
                <div class="compare-wrapper" id="compare-wrapper">
                    <!-- 原图 (底层) -->
                    <img id="compare-before" src="" alt="720P原图">
                    <!-- 高清图 (上层蒙版) -->
                    <div class="compare-after-container" id="compare-after-container">
                        <img id="compare-after" src="" alt="4K超清图">
                    </div>
                    <!-- 滑块轨道 -->
                    <input type="range" min="0" max="100" value="50" class="compare-slider" id="compare-slider">
                    <!-- 滑块手柄视觉 -->
                    <div class="compare-handle" id="compare-handle">
                        <div class="compare-handle-btn"><i data-lucide="chevrons-left-right" style="width: 16px; height: 16px;"></i></div>
                    </div>
                    
                    <div class="compare-label label-before">720P 原图</div>
                    <div class="compare-label label-after">4K 超清</div>
                </div>
            </div>
            <div class="modal-footer">
                <button id="btn-upscale-apply" class="btn btn-primary" style="margin-left: 12px;">
                    <i data-lucide="download"></i> 直接下载超清大图
                </button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/color-thief/2.3.0/color-thief.umd.js"></script>
    <script>
      lucide.createIcons();
    </script>
    <script src="/static/app.js?v=2"></script>
</body>
</html>
